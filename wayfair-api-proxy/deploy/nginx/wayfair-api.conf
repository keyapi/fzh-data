# Place in /etc/nginx/conf.d/ after replacing the placeholder host.
# The application only listens on 127.0.0.1:8410.
server {
    listen 443 ssl http2;
    server_name wayfair-api.example.com;

    ssl_certificate     /etc/letsencrypt/live/wayfair-api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wayfair-api.example.com/privkey.pem;

    # $uri 不含查询串，避免 OIDC code/state 进入访问日志。
    log_format wayfair '$remote_addr $request_method $uri $status '
                       '$body_bytes_sent $request_time $http_user_agent';
    access_log /var/log/nginx/wayfair-api.access.log wayfair;
    error_log  /var/log/nginx/wayfair-api.error.log;

    client_max_body_size 64k;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_pass http://127.0.0.1:8410;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
