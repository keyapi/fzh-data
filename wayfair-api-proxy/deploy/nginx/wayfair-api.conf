# Place in /etc/nginx/conf.d/ after replacing the placeholder host.
# The application only listens on 127.0.0.1:8410.
# log_format and limit_req_zone must stay in http context (outside server).

log_format wayfair '$remote_addr $request_method $uri $status '
                   '$body_bytes_sent $request_time';

limit_req_zone $binary_remote_addr zone=wayfair_ip:10m rate=10r/s;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wayfair-api.example.com;

    ssl_certificate     /etc/letsencrypt/live/wayfair-api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wayfair-api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:wayfair_tls:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/wayfair-api.access.log wayfair;
    error_log  /var/log/nginx/wayfair-api.error.log;

    client_max_body_size 64k;
    limit_req zone=wayfair_ip burst=20 nodelay;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # 管理入口只走 Tailscale/CLI；公网不暴露。
    location /admin/ {
        return 404;
    }

    # 就绪探针只给内网；公网只留 /health。
    location = /ready {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8410;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
