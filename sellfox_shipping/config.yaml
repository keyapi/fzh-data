# ── 承运人配置 ────────────────────────────────────────────────────

carriers:
  fedex:
    enabled: false  # P2 启用
    class: carriers.fedex.FedExCarrier
    label_format: ZPL
    credentials:
      api_key: ${FEDEX_API_KEY}
      api_secret: ${FEDEX_SECRET_KEY}
      account_number: ${FEDEX_ACCOUNT_NUMBER}
    default_services:
      US: FEDEX_GROUND
      EU: FEDEX_INTERNATIONAL_ECONOMY

  vite:
    enabled: true  # P5 启用
    label: "VITE"
    class: carriers.csv_polling.CSVPollingCarrier
    label_format: PDF
    csv_template: "数据源样例/vite_template.csv"

  lizard:
    enabled: true  # P5 启用
    label: "蜥蜴集团/蜴国际"
    class: carriers.csv_polling.CSVPollingCarrier
    label_format: PDF

  qitiao:
    enabled: false  # 待确认
    label: "七条物流(待确认)"
    class: carriers.csv_polling.CSVPollingCarrier
    label_format: PDF

  gls:
    enabled: false  # P5 启用
    class: carriers.gls.GLSCarrier
    label_format: PDF
    credentials:
      customer_id: ${GLS_CUSTOMER_ID}
      api_key: ${GLS_API_KEY}

  dhl:
    enabled: false  # P5 启用
    class: carriers.dhl.DHLCarrier
    label_format: PDF
    credentials:
      api_key: ${DHL_API_KEY}
      api_secret: ${DHL_SECRET_KEY}
      account_number: ${DHL_ACCOUNT_NUMBER}

default_carrier: fedex

# ── 物流规则（决策表，优先级升序）──────────────────────────────────

rules:
  - name: "US-Northeast-FedEx"
    conditions:
      destination_country: "US"
      destination_state: ["NJ", "NY", "PA", "CT", "MA", "RI", "VT", "NH", "ME"]
    carrier: fedex
    service: FEDEX_GROUND
    priority: 10

  - name: "US-Default-FedEx"
    conditions:
      destination_country: "US"
    carrier: fedex
    service: FEDEX_GROUND
    priority: 50

  - name: "EU-Poland-GLS"
    conditions:
      destination_country: ["PL", "DE", "FR", "CZ", "AT", "SK"]
      warehouse: POLAND
    carrier: gls
    priority: 10

  - name: "EU-Default-DHL"
    conditions:
      destination_country: ["DE", "UK", "IT", "ES", "SE", "DK", "FI", "NO", "NL", "BE"]
    carrier: dhl
    priority: 20

# ── 数据存储 ─────────────────────────────────────────────────────

store:
  db_path: "data/shipping.db"

server:
  host: "0.0.0.0"
  port: 8401
