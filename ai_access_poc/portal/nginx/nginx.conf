worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 100m;
    access_log /dev/stdout;

    # Docker embedded DNS — re-resolve when containers restart
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Service discovery via Docker DNS (variable proxy_pass)
    map $host $chat_upstream {
        default open-webui:8080;
    }
    map $host $ops_upstream {
        default ops-stub:8090;
    }
    map $host $oidc_upstream {
        default dingtalk-oidc:8086;
    }

    server {
        listen 80;
        server_name _;

        # Keep redirects relative so host port (e.g. :8088) is preserved
        absolute_redirect off;
        port_in_redirect off;

        root /usr/share/nginx/html;
        index index.html;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 600s;
        proxy_buffering off;

        location = /health {
            default_type application/json;
            return 200 '{"ok":true,"service":"fzh-ai-portal","routes":["/","/chat","/ops","/oidc"]}';
        }

        location = / {
            try_files /index.html =404;
        }

        # ---- /chat → Open WebUI ----
        # OWUI does not officially support subpaths. Strip /chat for entry HTML,
        # and proxy OWUI root asset paths so the SPA keeps working after load.
        # /ops stays fully namespaced (no /api collision with OWUI).
        location = /chat {
            return 302 /chat/;
        }
        location /chat/ {
            set $u $chat_upstream;
            proxy_pass http://$u/;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Script-Name /chat;
            proxy_redirect ~^https?://[^/]+/(.*)$ /chat/$1;
            proxy_redirect / /chat/;
        }

        location /_app/ {
            set $u $chat_upstream;
            proxy_pass http://$u;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
        location /static/ {
            set $u $chat_upstream;
            proxy_pass http://$u;
        }
        location /api/ {
            set $u $chat_upstream;
            proxy_pass http://$u;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
        location /ws {
            set $u $chat_upstream;
            proxy_pass http://$u;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
        location /ollama/ {
            set $u $chat_upstream;
            proxy_pass http://$u;
        }
        location /openai/ {
            set $u $chat_upstream;
            proxy_pass http://$u;
        }
        location /oauth/ {
            set $u $chat_upstream;
            proxy_pass http://$u;
        }

        # ---- /ops → board stub ----
        location = /ops {
            return 302 /ops/;
        }
        location /ops/ {
            set $o $ops_upstream;
            proxy_pass http://$o;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # ---- /oidc → 钉钉 OIDC (profile dingtalk); dry-run JSON if down ----
        location = /oidc {
            return 302 /oidc/;
        }
        location /oidc/ {
            set $d $oidc_upstream;
            rewrite ^/oidc/?(.*)$ /$1 break;
            proxy_pass http://$d;
            proxy_intercept_errors on;
            error_page 502 503 504 = @oidc_dry_run;
        }
        location @oidc_dry_run {
            default_type application/json;
            return 503 '{"ok":false,"service":"dingtalk-oidc","mode":"dry-run","hint":"Set DINGTALK_CLIENT_ID/SECRET in .env then: docker compose --profile dingtalk up -d"}';
        }
    }
}
