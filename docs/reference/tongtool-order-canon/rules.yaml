  - id: PRICE-004
    title: FBA 绕过后缀
    scope: [pricing, fba]
    applies_when:
      fulfillment: FBA
    then:
      shell_cost: "cost_fg"
      sx_processing: "sx_cost_all − cost_fg"
      destination_processing: 0
      head_freight: "对应国家 FBA 成品头程"
      shipping_method: "不看"
      suffix: "不看"
    exceptions:
      - "直采成品 cost_fg==sx_cost_all 且 cost_sxbzcp==0 时允许 sx=0（direct_purchase_zero）"
      - "sx<0 或恒等式不成立 → pending，不补 0"
    evidence:
      - "docs/reference/tongtool-order-canon/03-price-matrix.md §5（2026-11-06）"
      - "tongtool_order_cost/docs/reference/cost-engine-spec/35-phase4-fba-shadow.md"
      - "tongtool_order_cost/tongtool_order_cost/tongtu_cost_engine/domain/fba_shadow.py（2026-11-06 观测）"
    status: canon
    owner: finance
    effective_from: "2026-11"

  - id: PRICE-005
    title: 合并组不套后缀
    scope: [pricing, grouping]
    applies_when:
      merged_group: true
    then:
      suffix_matrix: "不套用"
      pricing: "按载体 shipping_method 取整件普通矩阵"
      components: "成本显式 0"
      unit_cost: "组总成本 ÷ 件数"
