  - id: PRICE-006
    title: 无后缀三档普通矩阵
    scope: [pricing, non_fba]
    applies_when:
      sku_suffix: none
      fulfillment: non_fba
      merged_group: false
    then:
      皮壳: {shell: "cost_fg", sx: 0, processing: "目的地 valuation", freight: "皮壳头程"}
      半成品: {shell: "cost_fg", sx: "cost_sxbzbcp", processing: "目的地 valuation", freight: "半成品头程"}
      成品: {shell: "cost_fg", sx: "cost_sxbzcp", processing: "目的地 valuation", freight: "成品头程"}
    exceptions:
