      shell_cost: 0
      sx_processing: "半成品 cost_sxbzbcp；成品 cost_sxbzcp"
      destination_processing: "目的地 valuation"
      head_freight: "半成品头程−皮壳头程；成品头程−皮壳头程"
    exceptions:
      - "差额为负的处理见 PRICE-008"
      - "FBA 绕过"
      - "合并组不套后缀"
    evidence:
      - "docs/reference/tongtool-order-canon/03-price-matrix.md §3.3（2026-11-06）"
      - "tongtool_order_cost/docs/reference/cost-engine-spec/38-en-line-identity-and-single-item-suffix.md"
      - "tongtool_integration/tongtool_integration/sync/order_sync.py（2026-11-06 观测）"
    status: canon
    owner: finance
    effective_from: "2026-11"

  - id: PRICE-003
    title: -PPCOTTON 计价（仅皮壳档）
    scope: [pricing, non_fba]
