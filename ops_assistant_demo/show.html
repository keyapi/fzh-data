<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知识辅助与受控办理 · 投屏讲解</title>
<style>
:root{--wine:#74152a;--red:#b32643;--rose:#f8eef0;--paper:#fffdfb;--ink:#2d1820;--muted:#725862;--line:#e6d5d9;--gold:#c79645}*{box-sizing:border-box}body{margin:0;background:#eee4e1;color:var(--ink);font:16px/1.7 "Noto Serif CJK SC","Songti SC","STSong","Microsoft YaHei",serif}header{min-height:64px;background:var(--wine);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 4vw;position:sticky;top:0;z-index:5;border-bottom:3px solid var(--gold)}header strong{margin-right:auto;letter-spacing:.12em}button,a.button{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;font:inherit;cursor:pointer;border:1px solid rgba(255,255,255,.54);border-radius:2px;padding:6px 13px;background:transparent;color:#fff;text-decoration:none}button.primary{background:#fff;color:var(--wine);border-color:#fff;font-weight:700}.guide{max-width:1180px;margin:14px auto 0;padding:10px 16px;border-left:4px solid var(--red);background:#fffaf8;color:var(--muted);font-size:13px}.guide summary{cursor:pointer;color:var(--wine);font-weight:700}main{max-width:1180px;margin:0 auto;padding:8px 18px 64px}.page{position:relative;min-height:640px;margin:18px 0;padding:42px 50px 92px;background:var(--paper);box-shadow:0 3px 14px rgba(63,19,29,.14);border-top:7px solid var(--wine)}.kicker{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:13px;letter-spacing:.16em;color:var(--red);font-weight:700}h1{font-size:40px;line-height:1.27;margin:10px 0 12px;max-width:950px;letter-spacing:.025em}h2{font-size:25px;margin:0 0 16px}.sub{font-size:18px;color:var(--muted);max-width:900px;margin:0 0 22px}.rule{height:4px;width:72px;background:linear-gradient(90deg,var(--wine) 0 74%,var(--gold) 74%);margin:15px 0 18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:14px 0}.card{padding:17px;border:1px solid var(--line);border-top:4px solid var(--red);background:var(--rose)}.card h3{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:17px;margin:0 0 8px}.card p{font-size:14px;margin:5px 0}.flow{display:flex;align-items:stretch;gap:7px;margin:22px 0}.node{flex:1;min-width:0;padding:12px 9px;text-align:center;background:var(--rose);border-top:3px solid var(--red);font-size:14px}.node strong{display:block;font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:16px}.arrow{align-self:center;color:var(--red);font-size:20px}.steps{margin:15px 0;padding:0;list-style:none}.steps li{padding:9px 0 9px 30px;border-bottom:1px solid var(--line);position:relative}.steps li:before{content:"";position:absolute;left:3px;top:17px;width:10px;height:10px;background:var(--red)}.foot{position:absolute;left:0;right:0;bottom:0;min-height:64px;display:flex;align-items:center;gap:18px;padding:12px 50px;background:var(--wine);color:#fff}.foot p{margin:0}.num{margin-left:auto;color:#f1d9a9}.speaker{display:none;color:var(--muted);font-size:14px}.faq{width:100%;border-collapse:collapse}.faq th,.faq td{text-align:left;vertical-align:top;padding:10px;border-bottom:1px solid var(--line)}.faq th{color:var(--wine);background:var(--rose);width:29%}.controls{display:none;position:fixed;right:20px;bottom:18px;z-index:10;align-items:center;gap:8px;padding:9px;background:rgba(116,21,42,.96);color:#fff;border-radius:3px;box-shadow:0 4px 15px rgba(57,9,20,.3)}.controls button{border-color:rgba(255,255,255,.5)}.timer{font-variant-numeric:tabular-nums}@media(max-width:800px){.grid,.flow{display:block}.node{margin:8px 0}.page{padding:26px 22px 100px;min-height:580px}.foot{padding:12px 22px}h1{font-size:30px}}body.present{background:#201015}body.present header,body.present .guide{display:none}body.present main{max-width:none;padding:0}body.present .page{display:none;margin:0;min-height:100vh;padding:54px 7vw 110px;box-shadow:none}body.present .page.selected{display:block}body.present h1{font-size:50px}body.present .controls{display:flex}@media print{header,.guide,.controls{display:none!important}body{background:#fff}.page,body.present .page{display:block!important;box-shadow:none;margin:0;min-height:0;padding:14mm 12mm;break-after:page}.speaker{display:block}.page:last-child{break-after:auto}}
/* Shared body typography: projection inherits these sizes without a second layout. */
.sub{font-size:22px}
.card h3{font-size:22px}
.card p,.steps li,.faq,.node{font-size:20px}
.node strong{font-size:22px}
</style></head><body>
<header><strong>知识辅助与受控办理 · 答辩投屏稿</strong><a class="button" href="/" target="_blank" rel="noopener">打开操作台</a><a class="button" href="/competition.html" target="_blank" rel="noopener">演示者工作台</a><button id="present" class="primary" type="button">进入投屏</button><button id="print" type="button">打印讲稿</button></header>
<div class="guide">6分钟答辩 · 前5页主讲，5分30秒结束，预留30秒机动；后2页仅供答疑。建议一人主讲、一人负责翻页与操作；若已有正式PPT，本页可作备用。限额预热最多30秒，超时跳过，优先完成工单主线。</div>
<main id="deck"></main><div class="controls"><span id="position"></span><button id="prev">上一页</button><button id="next">下一页</button><button id="clock">开始计时</button><span class="timer" id="timer">00:00</span></div>
<script type="text/plain" id="deck-source">
---
时间: 00:00–00:40
标题: 知识运营与受控办理 / 提升实施支持标准化水平
副题: 针对共性问题重复咨询、处置经验分散与专业人员依赖，建设可复用、可确认、可验收的实施支持能力。
卡片: 现状问题 | 资料与处置经验分散，人员需要反复求助，交付质量依赖个人经验
卡片: 本次做法 | 知识短问辅助判断；受控助手起草整组方案；人确认后由后台执行和核验
卡片: 预期价值 | 促进共性问题自助处置，减少反复求助与逐项核对，提升实施支持效率；具体成效通过试点对照验证
底栏: 促进经验复用、规范实施流程，支撑服务效能与交付质量提升。
口播: 实施支持中，共性问题反复咨询、处置经验分散，配置核对依赖专业人员。本项目分别以知识运营和受控办理支撑经验复用与实施标准化，随后通过实际演示说明办理过程和控制机制。
---
时间: 00:40–01:40
标题: 两个独立工具 / 知识支持与实施办理
副题: 知识运营助手提供依据与经验；操作助手准备配置方案，经人员确认后由后台执行和核验。当前两个工具独立运行。
卡片: 知识运营助手 | 以“余额查询报错”为例，查看回答与来源，由人员核对处置口径
卡片: 资料运营 | 展示脱敏样例上传与状态；当前自动通过，人工审核机制需在试点前完善
卡片: 操作助手 | 结合工单、配置现状与模拟规则准备整组方案；确认后执行，独立读回
底栏: 两个工具分别验证、分别评价；当前未共享身份、知识或业务接口。
口播: 主讲介绍分工后说“下面看知识如何支持处置”，操作人切知识助手。60秒内完成短问、来源和上传提交；不等待解析，既有状态须说明是预先准备的样例。到1分40秒仍未结束，则跳过限额预热。
---
时间: 01:40–04:20
标题: 受控办理 / 从单项确认到整组配置
副题: 工单包含旧模板与缺失端口；助手核对现状及规则，复用已有终端，仅追问必要信息。
步骤: 单项预热：测试限额20万元，核对方案、人工确认、读回结果。
步骤: 工单主线：选择 WO-DEMO-001，分析后补客户端端口9443。
步骤: 核对5项差异及依据；预演三个操作页，预演不保存。
步骤: 点击“允许修改（测试）”，查看独立读回与模拟验收。
底栏: 发现冲突、补齐缺项、确认范围，以核验结果说明办理是否完成。
口播: 主讲说“下面把业务要求转成可核对的办理方案”，操作人切操作台。限额预热最多30秒，超时直接跳过；工单主线2分10秒。两人分工：主讲解释冲突、缺项、确认和结果，操作人负责全部页面切换。停顿点是整组差异与人工确认，不逐字读字段。4分20秒结束演示；路由、失败恢复和岗位切换留答疑。
---
时间: 04:20–04:55
标题: 分层控制机制 / 确保授权范围与结果可核验
副题: 模型输出不构成操作授权；业务执行由后台校验岗位、范围、版本与确认状态，完成状态以独立核验结果为准。
卡片: 身份与范围 | 后台根据模拟岗位、环境和允许工具校验；生产只可准备申请
卡片: 确认绑定内容 | 待确认方案绑定版本、摘要和有效期；数据变化后旧确认失效
卡片: 结果独立产生 | 执行后重新读取配置并跑模拟验收；失败显示失败与恢复入口
底栏: 人工确认是必要门槛；模型、页面和资料都不能越过后台控制。
口播: 主讲归纳授权范围、人工确认和结果核验；操作人停在验收结果或切回本页，不再增加操作。模拟验收不等于真实网络联通或生产验证；人工确认不等于独立复核审批。
---
时间: 04:55–05:30
标题: 成效以对照验证 / 推广以受控试点推进
副题: 当前已验证模拟任务闭环。业务规模与效率收益将通过统一周期统计及同任务人工对照评估，尚未形成量化结论。
卡片: 业务规模评估 | 统计分行问询量、覆盖机构数、重复问题占比及平均处置时长；业务汇总数据待补充
卡片: 两类成效 · 分别测量 | 知识：有依据解答率、转人工率；操作：同一任务人工与助手完整耗时、验收通过率、人工干预次数
卡片: 推广路径 | 小范围试点→业务与风险复核→分批推广；明确知识责任人、岗位授权、培训支持与持续反馈
底栏: 以业务量、有效覆盖率与单笔净节时评价效率收益，形成可复核的试点依据。
口播: 主讲说“办理结果已经核验，我们回到应用成效与推广”，操作人切回本页。5分30秒完成，余下30秒用于等待和转场，不添加场景。请在答辩前补入真实汇总数据。知识与操作分开统计，计入查证、确认、纠错时间；推广先明确责任人与准入条件，不将试点预期说成全行已实现成效。
---
时间: 答疑备用 · 不计入主讲
标题: 扩展场景 / 业务路由与适配器配置
副题: 例如“开通余额查询”。助手将业务目标映射为客户端、请求应答适配器和业务路由的整组差异；未知业务或相互矛盾的范围会要求澄清。
步骤: 输入业务范围，查看复用项与新增项。
步骤: 预演客户端、适配器、路由管理三个页面。
步骤: 仍由侧边栏“允许修改（测试）”确认，随后查看模拟命中与范围检查。
底栏: 路由场景用于证明系统能把业务表达映射到多页面配置；真实映射需由业务人员校准。
口播: 仅在评委提问且允许追加演示时打开，不纳入6分钟主讲。
---
时间: 答疑备用 · 不计入主讲
标题: 常见问题
问答: 模型如何参与业务办理？ | 模型读取当前任务并调用受控工具，形成具体配置方案；后台确定性校验字段、权限与执行范围。不同工单和补充信息对应不同方案。
问答: 两个助手是否已实现互通？ | 当前为两个独立工具，未共享身份、知识或联通接口。操作助手使用预配置模拟规则；后续接入须完成知识版本与权限治理。
问答: 如何保障生产安全？ | 当前仅写入模拟测试配置；生产事项只准备申请。真实系统接入须落实正式身份、岗位授权、审批及接口治理。
问答: 如何评价成效并推进推广？ | 两个工具分别开展对照测评，记录完整处置耗时、解答质量与验收结果；经业务和风险复核后分批试点，持续培训与反馈优化。
底栏: 坚持业务验证、人工决策与受控执行，逐步推进场景落地。
口播: 只展开被问到的一项。所有材料均为模拟，不涉及真实客户或生产数据。
</script>
<script>
const raw=document.getElementById('deck-source').textContent;
const slides=raw.split(/\n---\n/).map(block=>{const s={cards:[],flow:[],steps:[],faqs:[]};block.split(/\r?\n/).forEach(line=>{const m=line.match(/^(时间|标题|副题|底栏|口播|卡片|流程|步骤|问答):\s*(.*)$/);if(!m)return;const k=m[1],v=m[2].trim();if(k==='卡片')s.cards.push(v);else if(k==='流程')s.flow.push(v);else if(k==='步骤')s.steps.push(v);else if(k==='问答')s.faqs.push(v);else s[{时间:'time',标题:'title',副题:'sub',底栏:'foot',口播:'speaker'}[k]]=v;});return s}).filter(s=>s.title);
const esc=v=>String(v||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const pair=v=>{const p=v.split('|');return[p.shift().trim(),p.join('|').trim()]};
document.getElementById('deck').innerHTML=slides.map((s,i)=>{const cards=s.cards.length?`<div class="grid">${s.cards.map(v=>{const [a,b]=pair(v);return `<article class="card"><h3>${esc(a)}</h3><p>${esc(b)}</p></article>`}).join('')}</div>`:'';const flow=s.flow.length?`<div class="flow">${s.flow.map((v,n)=>{const[a,b]=pair(v);return `${n?'<span class="arrow">→</span>':''}<div class="node"><strong>${esc(a)}</strong>${esc(b)}</div>`}).join('')}</div>`:'';const steps=s.steps.length?`<ol class="steps">${s.steps.map(v=>`<li>${esc(v)}</li>`).join('')}</ol>`:'';const faq=s.faqs.length?`<table class="faq"><tbody>${s.faqs.map(v=>{const[a,b]=pair(v);return`<tr><th>${esc(a)}</th><td>${esc(b)}</td></tr>`}).join('')}</tbody></table>`:'';return `<section class="page${i?'':' selected'}"><div class="kicker">${esc(s.time)}</div><h1>${esc(s.title).replaceAll(' / ','<br>')}</h1><div class="rule"></div><p class="sub">${esc(s.sub)}</p>${steps}${flow}${cards}${faq}<p class="speaker">${esc(s.speaker)}</p><div class="foot"><p>${esc(s.foot)}</p><span class="num">${String(i+1).padStart(2,'0')}</span></div></section>`}).join('');
const pages=[...document.querySelectorAll('.page')];let current=0,started=0;function render(){pages.forEach((p,i)=>p.classList.toggle('selected',i===current));document.getElementById('position').textContent=`${current+1} / ${pages.length}`;if(document.body.classList.contains('present'))scrollTo(0,0)}document.getElementById('present').onclick=()=>{document.body.classList.toggle('present');render()};document.getElementById('print').onclick=()=>print();document.getElementById('prev').onclick=()=>{current=Math.max(0,current-1);render()};document.getElementById('next').onclick=()=>{current=Math.min(pages.length-1,current+1);render()};document.getElementById('clock').onclick=()=>{started=Date.now();document.getElementById('clock').textContent='重新计时'};addEventListener('keydown',e=>{if(!document.body.classList.contains('present'))return;if(e.key==='ArrowRight'){current=Math.min(pages.length-1,current+1);render()}if(e.key==='ArrowLeft'){current=Math.max(0,current-1);render()}if(e.key==='Escape')document.body.classList.remove('present')});setInterval(()=>{if(!started)return;const n=Math.floor((Date.now()-started)/1000);document.getElementById('timer').textContent=`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`},500);render();
</script></body></html>
