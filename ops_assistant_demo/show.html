<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>运营配置辅助助手 · 投屏讲解</title>
<style>
:root{--navy:#112e51;--blue:#1769aa;--paper:#f6f8fb;--ink:#172b44;--muted:#587087;--line:#d7e1eb}*{box-sizing:border-box}body{margin:0;background:#dfe7ee;color:var(--ink);font:16px/1.7 "Microsoft YaHei","Noto Sans CJK SC",sans-serif}header{min-height:60px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 4vw;position:sticky;top:0;z-index:5}header strong{margin-right:auto;letter-spacing:.06em}button,a.button{font:inherit;cursor:pointer;border:1px solid rgba(255,255,255,.48);border-radius:3px;padding:6px 13px;background:transparent;color:#fff;text-decoration:none}button.primary{background:#fff;color:var(--navy);border-color:#fff}.guide{max-width:1180px;margin:14px auto 0;padding:10px 16px;border-left:4px solid var(--blue);background:#fff;color:var(--muted);font-size:13px}.guide summary{cursor:pointer;color:var(--navy);font-weight:700}main{max-width:1180px;margin:0 auto;padding:8px 18px 64px}.page{position:relative;min-height:640px;margin:18px 0;padding:42px 50px 92px;background:#fff;box-shadow:0 2px 10px rgba(17,46,81,.12)}.kicker{font-size:13px;letter-spacing:.14em;color:var(--blue);font-weight:700}h1{font-size:40px;line-height:1.27;margin:10px 0 12px;max-width:950px}h2{font-size:25px;margin:0 0 16px}.sub{font-size:18px;color:var(--muted);max-width:900px;margin:0 0 22px}.rule{height:4px;width:60px;background:var(--blue);margin:15px 0 18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:14px 0}.card{padding:17px;border:1px solid var(--line);border-top:4px solid var(--blue);background:var(--paper)}.card h3{font-size:17px;margin:0 0 8px}.card p{font-size:14px;margin:5px 0}.flow{display:flex;align-items:stretch;gap:7px;margin:22px 0}.node{flex:1;min-width:0;padding:12px 9px;text-align:center;background:var(--paper);border-top:3px solid var(--blue);font-size:14px}.node strong{display:block;font-size:16px}.arrow{align-self:center;color:var(--blue);font-size:20px}.steps{margin:15px 0;padding:0;list-style:none}.steps li{padding:9px 0 9px 30px;border-bottom:1px solid var(--line);position:relative}.steps li:before{content:"";position:absolute;left:3px;top:17px;width:10px;height:10px;background:var(--blue)}.foot{position:absolute;left:0;right:0;bottom:0;min-height:64px;display:flex;align-items:center;gap:18px;padding:12px 50px;background:var(--navy);color:#fff}.foot p{margin:0}.num{margin-left:auto;color:#b9d5e6}.speaker{display:none;color:var(--muted);font-size:14px}.faq{width:100%;border-collapse:collapse}.faq th,.faq td{text-align:left;vertical-align:top;padding:10px;border-bottom:1px solid var(--line)}.faq th{color:var(--navy);background:var(--paper);width:29%}.controls{display:none;position:fixed;right:20px;bottom:18px;z-index:10;align-items:center;gap:8px;padding:9px;background:rgba(17,46,81,.95);color:#fff;border-radius:4px}.controls button{border-color:rgba(255,255,255,.5)}.timer{font-variant-numeric:tabular-nums}@media(max-width:800px){.grid,.flow{display:block}.node{margin:8px 0}.page{padding:26px 22px 100px;min-height:580px}.foot{padding:12px 22px}h1{font-size:30px}}body.present{background:#101923}body.present header,body.present .guide{display:none}body.present main{max-width:none;padding:0}body.present .page{display:none;margin:0;min-height:100vh;padding:54px 7vw 110px;box-shadow:none}body.present .page.selected{display:block}body.present h1{font-size:50px}body.present .controls{display:flex}@media print{header,.guide,.controls{display:none!important}body{background:#fff}.page,body.present .page{display:block!important;box-shadow:none;margin:0;min-height:0;padding:14mm 12mm;break-after:page}.speaker{display:block}.page:last-child{break-after:auto}}
</style></head><body>
<header><strong>运营配置辅助助手 · 投屏讲解</strong><a class="button" href="/" target="_blank" rel="noopener">打开操作台</a><a class="button" href="/competition.html" target="_blank" rel="noopener">演示说明</a><button id="present" class="primary" type="button">投屏</button><button id="print" type="button">打印讲稿</button></header>
<div class="guide"><details><summary>讲者说明（现场投屏不显示）</summary><p>本稿是可选讲解材料，和自备 PPT 二选一。核心现场办理走“接入工单”，路由配置留作答疑扩展。所有数据、规则和验收均为模拟；模型慢时停在工单差异页解释核对项，不把录屏说成实时执行。</p></details></div>
<main id="deck"></main><div class="controls"><span id="position"></span><button id="prev">上一页</button><button id="next">下一页</button><button id="clock">开始计时</button><span class="timer" id="timer">00:00</span></div>
<script type="text/plain" id="deck-source">
---
时间: 00:00–00:35
标题: 运营配置辅助助手 / 让办理结果可核对
副题: 渠道接入资料、现行配置与字段规则分散在不同页面；难点不只是填写，而是判断哪些该保留、哪些该补充，以及如何证明结果。
卡片: 面向谁 | 渠道接入、联调准备与配置维护人员
卡片: 交付什么 | 有依据的整组差异、人工确认、读回与模拟验收
卡片: 本次范围 | 真实模型参与分析；业务数据、规则与环境均为模拟
底栏: 从业务目标出发，形成范围明确、可确认、可验收的配置方案。
口播: 今天演示的不是替人点表单，而是让助手先读工单、现状和规则，最后把每一步结果交给人核对。
---
时间: 00:35–01:10
标题: Agent 的价值 / 在判断和验收，不在代填
副题: 已经知道每个字段时，人工填写很快；真正耗时的是资料冲突、字段依赖、信息缺口和完成后的核验。
流程: 读取 | 工单、现状、适用规则
流程: 形成方案 | 保留正确项，标出差异与缺项
流程: 人工确认 | 确认具体范围，不授权任意动作
流程: 后台执行 | 仅模拟测试环境，随后独立读回验收
底栏: 模型负责理解与组织；权限、范围、保存和验收由后台确定性控制。
口播: 这也是和单纯知识问答的区别：问答告诉你规则，受控助手把规则落实为可检查的整组方案。
---
时间: 01:10–04:45
标题: 现场主线 / 一份渠道接入工单
副题: 选择 WO-DEMO-001。工单夹带过期模板，客户端端口缺失；系统应复用已有终端，并只追问确实缺少的一项。
步骤: 建立任务：读取工单、三页现状和现行模拟规则，尚不保存配置。
步骤: 分析后只补客户端端口 9443；展示 5 项整组差异及字段来源。
步骤: 点击“预演三页填写”：终端注册、注册参数、固定地址依次高亮与填写，预演不保存。
步骤: 在侧边栏点击“允许修改（测试）”：后台一次提交，独立读回并显示模拟验收。
底栏: 先发现问题，再确认范围，最后以读回和验收说明是否完成。
口播: 停顿点在整组差异和允许修改。不要逐字读全部字段；强调只问端口、已有终端被复用、确认前数据没变。
---
时间: 04:45–05:45
标题: 安全护栏 / 每一层都不能由模型绕过
副题: 演示中的答案、规则文本和聊天记录都不是权限；模型也不能用文字宣布已完成。
卡片: 身份与范围 | 后台根据模拟岗位、环境和允许工具校验；生产只可准备申请
卡片: 确认绑定内容 | 待确认方案绑定版本、摘要和有效期；数据变化后旧确认失效
卡片: 结果独立产生 | 执行后重新读取配置并跑模拟验收；失败显示失败与恢复入口
底栏: 人工确认是必要门槛；模型、页面和资料都不能越过后台控制。
口播: 如需互动，切换只读岗位尝试办理，或说明生产没有直接写入接口。不要把模拟岗位说成企业单点登录。
---
时间: 05:45–06:30
标题: 答疑扩展 / 按业务范围准备路由配置
副题: 例如“开通余额查询”。助手将业务目标映射为客户端、请求应答适配器和业务路由的整组差异；未知业务或相互矛盾的范围会要求澄清。
步骤: 输入业务范围，查看复用项与新增项。
步骤: 预演客户端、适配器、路由管理三个页面。
步骤: 仍由侧边栏“允许修改（测试）”确认，随后查看模拟命中与范围检查。
底栏: 路由场景用于证明系统能把业务表达映射到多页面配置；真实映射需由业务人员校准。
口播: 时间不够时只展示方案，不执行。它是主线之后的扩展，不替代已验证的工单办理。
---
时间: 06:30–07:00
标题: 交付的是证据 / 而不是一句成功
副题: 当前 POC 已覆盖模拟任务的读取、追问、方案、确认、保存、独立读回和模拟验收；真实接入需另行完成业务校准、权限映射与试点验证。
卡片: 给评审 | 业务痛点、主线剧本、安全边界与可追溯结果
卡片: 给演示者 | 排练入口、讲解稿、可重复准备的模拟工作区
卡片: 给后续试点 | 任务完成率、人工纠正次数、耗时与错误写入的同任务对照
底栏: 有依据、有边界、有结果；从可验证的模拟 POC 再走向受控试点。
口播: 不承诺未经实测的效率比例，也不把模拟验收说成真实网络连通或生产认证。
---
时间: 附录 · 答疑
标题: 常见质疑 / 可以直接回答
问答: 这是不是脚本包了聊天？ | 模型读取当前任务并调用受控工具；字段、权限、写入与验收仍由后端服务判定。可通过换工单、补充端口和改变业务范围验证不是固定回答。
问答: 为什么不直接接知识库？ | 规则可解释为什么，但仍需要把业务目标映射到字段、跨页差异和验收。当前资料是预配置的模拟规则与案例，带版本和来源标识。
问答: 会不会直接改生产？ | 不会。演示只写模拟测试环境；生产动作仅生成申请，真实系统需要正式身份、审批与接口治理。
问答: 为什么没有引入 Pi、MCP 或更多框架？ | 当前瓶颈是领域工具合同、权限、状态与确认体验。LangChain 已提供模型工具循环；新增框架不会自动补齐这些边界。后续可在同一任务集上比较运行框架。
底栏: 以实际任务结果和边界说明回答质疑，不用未验证的承诺。
口播: 只展开被问到的一项。所有材料均为模拟，不涉及真实客户或生产数据。
</script>
<script>
const raw=document.getElementById('deck-source').textContent;
const slides=raw.split(/\n---\n/).map(block=>{const s={cards:[],flow:[],steps:[],faqs:[]};block.split(/\r?\n/).forEach(line=>{const m=line.match(/^(时间|标题|副题|底栏|口播|卡片|流程|步骤|问答):\s*(.*)$/);if(!m)return;const k=m[1],v=m[2].trim();if(k==='卡片')s.cards.push(v);else if(k==='流程')s.flow.push(v);else if(k==='步骤')s.steps.push(v);else if(k==='问答')s.faqs.push(v);else s[{时间:'time',标题:'title',副题:'sub',底栏:'foot',口播:'speaker'}[k]]=v;});return s}).filter(s=>s.title);
const esc=v=>String(v||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const pair=v=>{const p=v.split('|');return[p.shift().trim(),p.join('|').trim()]};
document.getElementById('deck').innerHTML=slides.map((s,i)=>{const cards=s.cards.length?`<div class="grid">${s.cards.map(v=>{const [a,b]=pair(v);return `<article class="card"><h3>${esc(a)}</h3><p>${esc(b)}</p></article>`}).join('')}</div>`:'';const flow=s.flow.length?`<div class="flow">${s.flow.map((v,n)=>{const[a,b]=pair(v);return `${n?'<span class="arrow">→</span>':''}<div class="node"><strong>${esc(a)}</strong>${esc(b)}</div>`}).join('')}</div>`:'';const steps=s.steps.length?`<ol class="steps">${s.steps.map(v=>`<li>${esc(v)}</li>`).join('')}</ol>`:'';const faq=s.faqs.length?`<table class="faq"><tbody>${s.faqs.map(v=>{const[a,b]=pair(v);return`<tr><th>${esc(a)}</th><td>${esc(b)}</td></tr>`}).join('')}</tbody></table>`:'';return `<section class="page${i?'':' selected'}"><div class="kicker">${esc(s.time)}</div><h1>${esc(s.title).replaceAll(' / ','<br>')}</h1><div class="rule"></div><p class="sub">${esc(s.sub)}</p>${steps}${flow}${cards}${faq}<p class="speaker">${esc(s.speaker)}</p><div class="foot"><p>${esc(s.foot)}</p><span class="num">${String(i+1).padStart(2,'0')}</span></div></section>`}).join('');
const pages=[...document.querySelectorAll('.page')];let current=0,started=0;function render(){pages.forEach((p,i)=>p.classList.toggle('selected',i===current));document.getElementById('position').textContent=`${current+1} / ${pages.length}`;if(document.body.classList.contains('present'))scrollTo(0,0)}document.getElementById('present').onclick=()=>{document.body.classList.toggle('present');render()};document.getElementById('print').onclick=()=>print();document.getElementById('prev').onclick=()=>{current=Math.max(0,current-1);render()};document.getElementById('next').onclick=()=>{current=Math.min(pages.length-1,current+1);render()};document.getElementById('clock').onclick=()=>{started=Date.now();document.getElementById('clock').textContent='重新计时'};addEventListener('keydown',e=>{if(!document.body.classList.contains('present'))return;if(e.key==='ArrowRight'){current=Math.min(pages.length-1,current+1);render()}if(e.key==='ArrowLeft'){current=Math.max(0,current-1);render()}if(e.key==='Escape')document.body.classList.remove('present')});setInterval(()=>{if(!started)return;const n=Math.floor((Date.now()-started)/1000);document.getElementById('timer').textContent=`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`},500);render();
</script></body></html>
