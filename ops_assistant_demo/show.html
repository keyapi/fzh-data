<header><strong>知识辅助与受控办理 · 答辩投屏稿</strong><a class="button" href="/" target="_blank" rel="noopener">打开操作台</a><a class="button" href="/competition.html" target="_blank" rel="noopener">演示者工作台</a><button id="present" class="primary" type="button">进入投屏</button><button id="print" type="button">打印讲稿</button></header>
<div class="guide"><details><summary>这是评审投屏稿；操作步骤、排练和反馈请打开“演示者工作台”（现场投屏不显示）</summary><p>核心现场办理走“接入工单”，路由配置留作答疑扩展。所有数据、规则和验收均为模拟；模型慢时停在工单差异页解释核对项，不把录屏说成实时执行。</p></details></div>
<main id="deck"></main><div class="controls"><span id="position"></span><button id="prev">上一页</button><button id="next">下一页</button><button id="clock">开始计时</button><span class="timer" id="timer">00:00</span></div>
<script type="text/plain" id="deck-source">
---
时间: 00:00–00:45
标题: 从经验分散到可控办理 / 让实施支持形成闭环
副题: 现状是共性问题反复咨询、经验散落、熟手依赖较强；目标是把“知道怎么做”转成可复用、可确认、可验收的支持能力。
卡片: 现状问题 | 资料与处置经验分散，人员需要反复求助，交付质量依赖个人经验
卡片: 本次做法 | 知识短问辅助判断；受控助手起草整组方案；人确认后由后台执行和核验
卡片: 当前证据 | 真实模型参与分析；业务数据、规则与环境均为模拟，结果以读回和模拟验收呈现
底栏: 以“问题—目标—做法—证据”组织演示：不承诺未实测收益，只展示可核对的闭环。
口播: 今天演示的不是替人点表单，而是把经验辅助、方案确认和结果核对串成一个闭环。先看问题和目标，再用两个实际场景给出证据。
---
时间: 00:45–01:10
标题: 知识辅助与受控办理 / 共同服务实施工作
副题: 财资助手提供问询与知识运营；操作助手根据业务目标起草配置方案。两套演示共同说明实施支持路径，当前未自动共享知识或联通接口。
流程: 读取 | 工单、现状、适用规则
流程: 形成方案 | 保留正确项，标出差异与缺项
流程: 人工确认 | 确认具体范围，不授权任意动作
流程: 后台执行 | 仅模拟测试环境，随后独立读回验收
底栏: 模型负责理解与组织；权限、范围、保存和验收由后台确定性控制。
口播: 先展示组员的财资助手，再展示受控办理。知识帮助实施人员理解处置口径；操作部分让具体变更可核对、可确认、可验收。
---
时间: 01:10–02:25
标题: 财资助手短问 / 让经验可以复用
副题: 切到财资助手，提问“余额查询报错”，打开答案引用，说明知识如何形成与纠偏。
步骤: 提问并打开引用：观察来源是否支持回答；若没有足够依据，应明确说明信息缺口。
步骤: 知识运营：展示脱敏样例上传后的处理状态与审核入口。当前实测的模拟样例自动显示“已通过”，不可把它说成逐条人工审核。
步骤: 讲清分流：群聊经验应整理、脱敏并经人工审核；官方资料仍需核对来源、版本和适用范围。反馈用于纠偏，不自动成为可信规则。
底栏: 知识质量决定建议质量；上传、审核、发布与调用是不同环节。
口播: 本段共75秒，问答与引用约35秒，治理说明约25秒，上传或状态画面约15秒。预先打开演示资料和页面；上传处理耗时较长时展示既有样例状态，明确不是刚才上传的结果。当前自动通过的状态是试点前要补齐人工审核的治理缺口，不要将操作台预置资料说成财资助手实时检索结果。
---
时间: 02:25–03:15
标题: 简单操作预热 / 改之前必须有人确认
副题: 在操作助手中提出“把测试限额改为20万元”。先用一个容易理解的动作，让评审看见人机分工。
步骤: 助手起草具体方案，页面高亮与填写；确认前配置保持原值。
步骤: 实施人员核对后点击“允许修改（测试）”；后台保存并独立读回。
步骤: 指出本次仅改变模拟测试配置，生产保持不变。
底栏: 助手提出建议；人决定是否实施，系统在确认后执行这一次变更。
口播: 50秒内结束，不展开全部工具轨迹。转场：简单例子证明确认边界，下面看不必先知道每个参数的复杂办理。
---
时间: 03:15–05:55
标题: 现场主线 / 一份渠道接入工单
副题: 选择 WO-DEMO-001。工单夹带过期模板，客户端端口缺失；系统应复用已有终端，并只追问确实缺少的一项。
步骤: 建立任务：读取工单、三页现状和现行模拟规则，尚不保存配置。
步骤: 分析后只补客户端端口 9443；展示 5 项整组差异及字段来源。
步骤: 点击“预演三页填写”：终端注册、注册参数、固定地址依次高亮与填写，预演不保存。
步骤: 在侧边栏点击“允许修改（测试）”：后台一次提交，独立读回并显示模拟验收。
底栏: 先发现问题，再确认范围，最后以读回和验收说明是否完成。
口播: 停顿点在整组差异和允许修改。不要逐字读全部字段；强调只问端口、已有终端被复用、确认前数据没变。
---
时间: 05:55–06:40
标题: 安全护栏 / 每一层都不能由模型绕过
副题: 演示中的答案、规则文本和聊天记录都不是权限；模型也不能用文字宣布已完成。
卡片: 身份与范围 | 后台根据模拟岗位、环境和允许工具校验；生产只可准备申请
卡片: 确认绑定内容 | 待确认方案绑定版本、摘要和有效期；数据变化后旧确认失效
卡片: 结果独立产生 | 执行后重新读取配置并跑模拟验收；失败显示失败与恢复入口
底栏: 人工确认是必要门槛；模型、页面和资料都不能越过后台控制。
口播: 如需互动，切换只读岗位尝试办理，或说明生产没有直接写入接口。不要把模拟岗位说成企业单点登录。
---
时间: 06:40–07:30
标题: 交付的是证据 / 而不是一句成功
副题: 当前 POC 已覆盖模拟任务的读取、追问、方案、确认、保存、独立读回和模拟验收；真实接入需另行完成业务校准、权限映射与试点验证。
卡片: 实施侧赋能 | 复用处置知识，减少反复求助，支持人员学习与自主实施
卡片: 支持侧减负 | 共性问题由助手辅助，复杂事项转专业支持，重大故障由专家处置
卡片: 组织侧沉淀 | 将经验转成可治理、可复核的知识与办理方法；以试点对照验证价值
底栏: 有依据、有边界、有结果；从可验证的模拟 POC 再走向受控试点。
口播: 不承诺未经实测的效率比例，也不把模拟验收说成真实网络连通或生产认证。
---
时间: 答疑备用 · 不占主流程
标题: 答疑扩展 / 按业务范围准备路由配置
副题: 例如“开通余额查询”。助手将业务目标映射为客户端、请求应答适配器和业务路由的整组差异；未知业务或相互矛盾的范围会要求澄清。
步骤: 输入业务范围，查看复用项与新增项。
步骤: 预演客户端、适配器、路由管理三个页面。
步骤: 仍由侧边栏“允许修改（测试）”确认，随后查看模拟命中与范围检查。
底栏: 路由场景用于证明系统能把业务表达映射到多页面配置；真实映射需由业务人员校准。
口播: 时间不够时只展示方案，不执行。它是主线之后的扩展，不替代已验证的工单办理。
---
时间: 附录 · 答疑
标题: 常见质疑 / 可以直接回答
问答: 这是不是脚本包了聊天？ | 模型读取当前任务并调用受控工具；字段、权限、写入与验收仍由后端服务判定。可通过换工单、补充端口和改变业务范围验证不是固定回答。
问答: 为什么不直接接知识库？ | 规则可解释为什么，但仍需要把业务目标映射到字段、跨页差异和验收。当前资料是预配置的模拟规则与案例，带版本和来源标识。
问答: 会不会直接改生产？ | 不会。演示只写模拟测试环境；生产动作仅生成申请，真实系统需要正式身份、审批与接口治理。
问答: 为什么没有引入 Pi、MCP 或更多框架？ | 当前瓶颈是领域工具合同、权限、状态与确认体验。LangChain 已提供模型工具循环；新增框架不会自动补齐这些边界。后续可在同一任务集上比较运行框架。
底栏: 以实际任务结果和边界说明回答质疑，不用未验证的承诺。
口播: 只展开被问到的一项。所有材料均为模拟，不涉及真实客户或生产数据。
</script>
<script>
const raw=document.getElementById('deck-source').textContent;
const slides=raw.split(/\n---\n/).map(block=>{const s={cards:[],flow:[],steps:[],faqs:[]};block.split(/\r?\n/).forEach(line=>{const m=line.match(/^(时间|标题|副题|底栏|口播|卡片|流程|步骤|问答):\s*(.*)$/);if(!m)return;const k=m[1],v=m[2].trim();if(k==='卡片')s.cards.push(v);else if(k==='流程')s.flow.push(v);else if(k==='步骤')s.steps.push(v);else if(k==='问答')s.faqs.push(v);else s[{时间:'time',标题:'title',副题:'sub',底栏:'foot',口播:'speaker'}[k]]=v;});return s}).filter(s=>s.title);
const esc=v=>String(v||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const pair=v=>{const p=v.split('|');return[p.shift().trim(),p.join('|').trim()]};
document.getElementById('deck').innerHTML=slides.map((s,i)=>{const cards=s.cards.length?`<div class="grid">${s.cards.map(v=>{const [a,b]=pair(v);return `<article class="card"><h3>${esc(a)}</h3><p>${esc(b)}</p></article>`}).join('')}</div>`:'';const flow=s.flow.length?`<div class="flow">${s.flow.map((v,n)=>{const[a,b]=pair(v);return `${n?'<span class="arrow">→</span>':''}<div class="node"><strong>${esc(a)}</strong>${esc(b)}</div>`}).join('')}</div>`:'';const steps=s.steps.length?`<ol class="steps">${s.steps.map(v=>`<li>${esc(v)}</li>`).join('')}</ol>`:'';const faq=s.faqs.length?`<table class="faq"><tbody>${s.faqs.map(v=>{const[a,b]=pair(v);return`<tr><th>${esc(a)}</th><td>${esc(b)}</td></tr>`}).join('')}</tbody></table>`:'';return `<section class="page${i?'':' selected'}"><div class="kicker">${esc(s.time)}</div><h1>${esc(s.title).replaceAll(' / ','<br>')}</h1><div class="rule"></div><p class="sub">${esc(s.sub)}</p>${steps}${flow}${cards}${faq}<p class="speaker">${esc(s.speaker)}</p><div class="foot"><p>${esc(s.foot)}</p><span class="num">${String(i+1).padStart(2,'0')}</span></div></section>`}).join('');
const pages=[...document.querySelectorAll('.page')];let current=0,started=0;function render(){pages.forEach((p,i)=>p.classList.toggle('selected',i===current));document.getElementById('position').textContent=`${current+1} / ${pages.length}`;if(document.body.classList.contains('present'))scrollTo(0,0)}document.getElementById('present').onclick=()=>{document.body.classList.toggle('present');render()};document.getElementById('print').onclick=()=>print();document.getElementById('prev').onclick=()=>{current=Math.max(0,current-1);render()};document.getElementById('next').onclick=()=>{current=Math.min(pages.length-1,current+1);render()};document.getElementById('clock').onclick=()=>{started=Date.now();document.getElementById('clock').textContent='重新计时'};addEventListener('keydown',e=>{if(!document.body.classList.contains('present'))return;if(e.key==='ArrowRight'){current=Math.min(pages.length-1,current+1);render()}if(e.key==='ArrowLeft'){current=Math.max(0,current-1);render()}if(e.key==='Escape')document.body.classList.remove('present')});setInterval(()=>{if(!started)return;const n=Math.floor((Date.now()-started)/1000);document.getElementById('timer').textContent=`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`},500);render();
</script></body></html>
