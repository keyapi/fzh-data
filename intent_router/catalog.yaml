    exclusions: 不用于库存初始值导入(stock-init)、不用于商品重尺(item-weight)、不用于海外仓备货单的成本拆分(warehouse-restock)
    examples: [采购成本, 采购成本导入, BOM成本, 绍兴发货成本, 成本导入, 采购单价, 成本借用, item_cost_sx]
    run: cd item_cost_sx/ && uv run python bom_cost_to_saihu_item_cost.py

