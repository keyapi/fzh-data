# 运行时目录真源：中文意图 → 本仓库模块。
#
# 与 AGENTS.md 的「模块索引」表一一对应，tests/test_catalog.py 会解析 AGENTS.md
# 并断言两边集合相等 —— 任一边增删模块而另一边没跟上，测试就会红。
#
# 为什么是人工策展而不是自动派生：.agents/skills/ 的目录数比 AGENTS.md 模块索引表多十几个
# （14 个多出来、8 个对不上）；触发信息散在三种形状（triggers: 列表 / trigger: 单值 /
# 内嵌在 description 里 / 5 个完全没有）；目录还是多对一（sellfox-api 与
# sellfox-combo-create 同指 SELLFOX_API/）。没有任何单一自动源成立。
#
# 字段说明：
#   skill       模块名，与 AGENTS.md 表第一列完全一致（保留连字符）—— 也是送给模型的选项名
#   dir         仓库内目录；external 条目为 null
#   summary     一句话（取自 AGENTS.md 表第三列）
#   coverage    覆盖什么 —— 送给模型
#   exclusions  不用于什么 —— 这是最难的部分，兄弟模块全靠它分开
#   examples    中文口语样例（多取自 SKILL.md 的触发词）
#   run         可选；只有已核实脚本名的条目才填（不臆造命令）
#   web_task    可选；必须是 web_automation/capabilities.yaml 里的能力 id
#   external    可选；true 表示不在本仓库（外部 skill）
#
# 注意：none 选项不在这里 —— 它由 typesafe.build_payload() 硬编码追加在最后，
# 防止重新生成 catalog 时被漏掉。

version: 1
model: jev-latest

options:
  - skill: stock-init
    dir: stock_init/
    summary: 通途库存 + EN BOM → 赛狐库存初始值
    coverage: 赛狐库存初始值导入：从通途多仓库存 + EN BOM 成本生成赛狐库存导入文件（数量 + 成本）
    exclusions: 不用于采购成本导入(item-cost)、不用于商品重尺(item-weight)、不用于把已有库存清零(other-outbound)
    examples: [导入库存初始值, 库存导入, 把通途库存初始化到赛狐, stock_init, 库存初始化, 初始库存, 仓库库存导入, 共享库存]
    run: cd stock_init/ && uv run python build_saihu_stock_init.py

