<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PB 订单处理{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>📦</text></svg>">
  <link rel="stylesheet" href="{{ prefix }}/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ prefix }}/">PB 订单处理</a>
    <nav>
      <a href="{{ prefix }}/">历史任务</a>
      <a href="{{ prefix }}/jobs/new">新建任务</a>
      {% if auth_enabled and user %}
      <span class="who">{{ user.display_name }}</span>
      <form method="post" action="{{ prefix }}/logout" class="inline-form">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button type="submit" class="linklike">退出</button>
      </form>
      {% endif %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="foot">
    Pottery Barn 出件：通途导入 xlsx · 标签 PDF · 背贴 PDF（离线，只读本地 SKU 缓存）
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
