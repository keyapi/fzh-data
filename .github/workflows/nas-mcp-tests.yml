name: nas-mcp offline tests

on:
  push:
    paths:
      - "nas_mcp/**"
      - ".github/workflows/nas-mcp-tests.yml"
  pull_request:
    paths:
      - "nas_mcp/**"
      - ".github/workflows/nas-mcp-tests.yml"

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install nas_mcp dependencies
        run: pip install -r nas_mcp/requirements.txt
      - name: Run offline tests (no NAS, no network)
        run: python nas_mcp/tests/test_offline.py
