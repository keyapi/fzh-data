<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base href="/sellfox/admin/">
<title>API Proxy — Login</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
       background: #f5f5f5; display: flex; align-items: center; justify-content: center;
       min-height: 100vh; }
.card { background: #fff; border-radius: 12px; padding: 40px; width: 380px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
.card h1 { font-size: 20px; margin-bottom: 8px; }
.card p { color: #999; font-size: 13px; margin-bottom: 24px; }
.form-group { margin-bottom: 16px; }
.form-group input { width: 100%; padding: 10px 14px; border: 1px solid #ddd;
                    border-radius: 8px; font-size: 15px; }
.form-group input:focus { outline: none; border-color: #1a73e8; }
.btn { width: 100%; padding: 10px; background: #1a73e8; color: #fff;
       border: none; border-radius: 8px; font-size: 15px; cursor: pointer; }
.btn:hover { background: #1557b0; }
.btn-dingtalk { background: #0089FF; margin-top: 12px; }
.btn-dingtalk:hover { background: #0074d9; }
.error { background: #fce8e6; color: #d93025; padding: 10px 14px;
         border-radius: 8px; margin-bottom: 16px; font-size: 13px; display: none; }
.divider { display: flex; align-items: center; margin: 20px 0; }
.divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #ddd; }
.divider span { padding: 0 12px; color: #999; font-size: 12px; }
</style>
</head>
<body>
<div class="card">
  <h1>API Proxy Admin</h1>
  <p>Sign in with DingTalk or admin key.</p>
  <div id="error">Invalid admin key</div>
  <form method="post" action="login">
    <div class="form-group">
      <input type="password" name="password" placeholder="Admin Key" autofocus>
    </div>
    <button type="submit" class="btn">Sign In</button>
  </form>
  <div class="divider"><span>or</span></div>
  <a href="oidc-login">
    <button type="button" class="btn btn-dingtalk">钉钉登录</button>
  </a>
</div>
</body>
</html>
