[project]
name = "saihu-data-pipeline"
version = "0.1.0"
description = "赛狐/ERPNext/通途数据一致性维护工具集"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "openpyxl",
    "requests",
    "fastapi>=0.136.3",
    "uvicorn>=0.49.0",
    "python-multipart>=0.0.32",
    "aiofiles>=25.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["multi_attr_saihu", "category", "item_cost_sx", "item_weight_size", "EN_API"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
