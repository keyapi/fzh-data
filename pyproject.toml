[project]
name = "saihu-data-pipeline"
version = "0.1.0"
description = "赛狐/ERPNext/通途数据一致性维护工具集"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "openpyxl",
    "requests",
    "fastapi>=0.136.3",
    "uvicorn>=0.49.0",
    "python-multipart>=0.0.32",
    "aiofiles>=25.1.0",
    "pillow>=12.2.0",
    "sqlalchemy>=2.0.50",
    "openai>=2.41.0",
    "synology-api>=0.9.0",
    "paramiko>=5.0.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jinja2>=3.0",
    "typer>=0.9",
    "alembic>=1.18.5",
]

[tool.hatch.build.targets.wheel]
packages = ["multi_attr_saihu", "category", "item_cost_sx", "item_weight_size", "EN_API", "sellfox_shipping"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
