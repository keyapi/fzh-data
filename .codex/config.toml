# Project-level Codex configuration for fzh-data
# Committed to repo -- every Codex user who opens this project gets these MCP servers.
#
# After clone, the Agent reads AGENTS.md -> finds the web search guide -> runs:
#   uv pip install git+https://github.com/changcheng967/free-web-tools.git
#   npm install -g @playwright/mcp && npx playwright install chromium
# Then restarts Codex -> and these MCP servers are ready.

# ===== MCP: free-web-tools (search + fetch, zero API key) =====
# 8 tools: deep_search, web_search, fetch_url, news_search, instant_answer, etc.
# Install: uv pip install git+https://github.com/changcheng967/free-web-tools.git
[mcp_servers.free_web]
command = "uv"
args = ["run", "python", "-m", "mcp_server"]
startup_timeout_sec = 60

# ===== MCP: Playwright (browser automation) =====
# Full browser -- navigate, search, screenshot, fill forms.
# Install: npm install -g @playwright/mcp && npx playwright install chromium
[mcp_servers.playwright]
command = "npx"
args = ["@playwright/mcp"]
startup_timeout_sec = 60

# ===== Approval: trust tools in this project =====
# Pre-approve browser navigation and typing so web search doesn't prompt every time
[mcp_servers.playwright.tools.browser_navigate]
approval_mode = "approve"

[mcp_servers.playwright.tools.browser_type]
approval_mode = "approve"

[mcp_servers.playwright.tools.browser_click]
approval_mode = "approve"

[mcp_servers.playwright.tools.browser_select_option]
approval_mode = "approve"

[mcp_servers.playwright.tools.browser_evaluate]
approval_mode = "approve"

# ===== MCP: Tavily (AI-optimized web search, 1000 free calls/mo) =====
# Tools: search, extract, map, crawl
# Install: uv pip install mcp-tavily
# Get API key: https://app.tavily.com/home
[mcp_servers.tavily]
command = "uv"
args = ["run", "python", "-m", "mcp_server_tavily"]
startup_timeout_sec = 60

[mcp_servers.tavily.env]
TAVILY_API_KEY = "<your-tavily-api-key>"



